name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Tests run against Postgres here even though local development uses SQLite (DECISIONS D-002).
    # CI is the only place the production database engine is currently exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: easykharcha_test
          POSTGRES_USER: easykharcha
          POSTGRES_PASSWORD: easykharcha
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://easykharcha:easykharcha@localhost:5432/easykharcha_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value-padding

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: Migrations are complete
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
