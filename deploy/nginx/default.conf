# ⚠ Never served — written for the DigitalOcean target, unexercised. See docs/DECISIONS.md D-002.
#
# `server_name` is a placeholder: which of the purchased domains (.com/.ai/.in) is primary has not
# been confirmed (DECISIONS O-4). Substitute before issuing a certificate.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12M;  # invoice photos and POS exports

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # The Expo web export (`npx expo export --platform web`). Single-page output, so unknown paths
    # fall back to index.html for client-side routing.
    location / {
        root /srv/app;
        try_files $uri $uri/ /index.html;
    }
}
