server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker and the PWA manifest must never be cached — a stale sw.js would keep a
    # browser from ever noticing a new version is available.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Expo's content-hashed bundle output (the filename changes whenever the content does) — safe to
    # cache forever.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # expo-router's client-side routes (e.g. /signup, /login) aren't real files on disk — fall back
    # to the SPA shell for anything that isn't a real exported asset. index.html itself must never be
    # cached, or a browser (or an intermediate cache) could keep serving a stale shell after a deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
