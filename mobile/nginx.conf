server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker itself must never be cached — a stale copy would keep serving a stale app
    # shell to anyone with the PWA already installed.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # expo-router's client-side routes (e.g. /signup, /login) aren't real files on disk — fall back
    # to the SPA shell for anything that isn't a real exported asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
