# Production stack for a single Ubuntu droplet — Caddy is the only container exposed to the internet
# (ports 80/443); everything else talks over the compose network only. See deploy/README.md for the
# first-time server setup and deploy.sh for how this gets built and started.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: deploy/.env.production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $), and env_file's values, not a top-level .env docker compose would otherwise
      # interpolate this from — POSTGRES_USER/POSTGRES_DB only exist in deploy/.env.production, which
      # is loaded into the container's own environment, not into compose's interpolation context.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: deploy/.env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ai_tmp_files:/app/ai_tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  worker:
    # Same image as backend — just a different entrypoint command, so menu reading (ai/jobs.py) runs
    # in its own process and never blocks a gunicorn request. One job at a time, lean on purpose for
    # a 2 GB droplet — see backend/ai/management/commands/run_ai_jobs.py. Shares ai_tmp_files with
    # backend: the web process saves an uploaded menu's files there, this process reads and deletes
    # them — two different containers, so without the shared volume the worker couldn't see them.
    build:
      context: ./backend
    restart: unless-stopped
    env_file: deploy/.env.production
    command: python manage.py run_ai_jobs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ai_tmp_files:/app/ai_tmp
    logging: *default-logging

  web-app:
    build:
      context: .
      dockerfile: mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://api.easykharcha.com/api/v1
        EXPO_PUBLIC_LANDING_URL: https://easykharcha.com
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — alpine's wget resolves "localhost" to ::1 first, and nginx (the
      # default.conf shipped in the mobile/landing images) only listens on IPv4, so the IPv6 attempt
      # fails and wget reports the container unhealthy even though it's serving fine on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  landing:
    build:
      context: ./landing
      args:
        APP_URL: https://app.easykharcha.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      - backend
      - web-app
      - landing
    logging: *default-logging

volumes:
  db_data:
  static_files:
  media_files:
  ai_tmp_files:
  caddy_data:
  caddy_config:
